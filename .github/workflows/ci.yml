name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python helpers
        run: |
          python3 -I -X pycache_prefix="$RUNNER_TEMP/waited-delivery-pycache" -m py_compile skills/waited-delivery/scripts/*.py
      - name: Run tests
        run: |
          python3 -I -m unittest discover -s skills/waited-delivery/tests
  strict-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out strict live candidate
        uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          persist-credentials: false
      - name: Set up configured Python for strict live evidence
        uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: "3.x"
      - name: Harden strict live runtime roots
        timeout-minutes: 2
        run: |
          if [[ ! "$pythonLocation" =~ ^/opt/hostedtoolcache/Python/[0-9]+\.[0-9]+\.[0-9]+/x64$ ]]; then
            echo "unexpected configured Python location: $pythonLocation" >&2
            exit 1
          fi
          python_version_dir="${pythonLocation%/*}"
          python_family_dir="${python_version_dir%/*}"
          for path in \
            /usr/share/zoneinfo \
            "$pythonLocation" \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
          do
            if [[ ! -d "$path" || -L "$path" ]]; then
              echo "unsafe strict runtime path: $path" >&2
              exit 1
            fi
          done
          acl_tool=/usr/bin/setfacl
          if [[ ! -f "$acl_tool" || -L "$acl_tool" || ! -x "$acl_tool" ]]; then
            echo "trusted setfacl is unavailable" >&2
            exit 1
          fi
          unset POSIXLY_CORRECT
          sudo "$acl_tool" --recursive --physical --remove-all --remove-default -- /usr/share/zoneinfo "$pythonLocation"
          sudo "$acl_tool" --remove-all --remove-default -- \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
          sudo chmod -R a-w -- /usr/share/zoneinfo "$pythonLocation"
          sudo chmod a-w -- \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
      - name: Run strict target credential live test
        timeout-minutes: 15
        env:
          REQUIRED_CI_CANDIDATE_SHA: ${{ github.sha }}
          REQUIRED_CI_ISOLATION_MODE: sudo-setpriv-v1
        run: |
          python3 -I -B -S skills/waited-delivery/tests/test_required_ci_workflow.py --run-strict-runtime-live-test
