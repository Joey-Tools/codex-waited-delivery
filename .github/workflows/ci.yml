name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.9"
          - "3.x"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python helpers
        run: |
          python -m py_compile \
            skills/waited-delivery-compat/scripts/*.py \
            skills/waited-delivery/scripts/*.py \
            legacy-hook-shims/waited-delivery/scripts/*.py
      - name: Run tests
        run: |
          python -m unittest discover -s skills/waited-delivery-compat/tests
