name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 37
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-waited-delivery' }}
        timeout-minutes: 1
        run: exit 1
      - name: Check out candidate
        uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          repository: Joey-Tools/codex-waited-delivery
          ref: ${{ github.sha }}
          path: .candidate
          persist-credentials: false
      - name: Check out trusted Required CI source
        uses: actions/checkout@v4
        timeout-minutes: 3
        with:
          # GitHub.com job workflow identity pins this reusable leaf's own source.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .required-ci
          persist-credentials: false
      - uses: actions/setup-python@v5
        timeout-minutes: 3
        with:
          python-version: "3.x"
      - name: Harden strict live runtime roots
        timeout-minutes: 2
        run: |
          if [[ ! "$pythonLocation" =~ ^/opt/hostedtoolcache/Python/[0-9]+\.[0-9]+\.[0-9]+/x64$ ]]; then
            echo "unexpected configured Python location: $pythonLocation" >&2
            exit 1
          fi
          python_version_dir="${pythonLocation%/*}"
          python_family_dir="${python_version_dir%/*}"
          for path in \
            /usr/share/zoneinfo \
            "$pythonLocation" \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
          do
            if [[ ! -d "$path" || -L "$path" ]]; then
              echo "unsafe strict runtime path: $path" >&2
              exit 1
            fi
          done
          acl_tool=/usr/bin/setfacl
          if [[ ! -f "$acl_tool" || -L "$acl_tool" || ! -x "$acl_tool" ]]; then
            echo "trusted setfacl is unavailable" >&2
            exit 1
          fi
          unset POSIXLY_CORRECT
          sudo "$acl_tool" --recursive --physical --remove-all --remove-default -- /usr/share/zoneinfo "$pythonLocation"
          sudo "$acl_tool" --remove-all --remove-default -- \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
          sudo chmod -R a-w -- /usr/share/zoneinfo "$pythonLocation"
          sudo chmod a-w -- \
            /usr/share \
            /opt \
            /opt/hostedtoolcache \
            "$python_family_dir" \
            "$python_version_dir"
      - name: Compile candidate Python helpers
        timeout-minutes: 2
        run: |
          python3 -I -X pycache_prefix="$RUNNER_TEMP/required-ci-pycache" -m py_compile "$GITHUB_WORKSPACE/.candidate/skills/waited-delivery/scripts/waited_delivery_bridge.py" "$GITHUB_WORKSPACE/.candidate/skills/waited-delivery/scripts/waited_delivery_hook_adapter.py" "$GITHUB_WORKSPACE/.candidate/skills/waited-delivery/scripts/waited_delivery_runner.py"
      - name: Validate Required CI structure
        timeout-minutes: 3
        env:
          REQUIRED_CI_CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
          REQUIRED_CI_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python3 -I "$GITHUB_WORKSPACE/.required-ci/skills/waited-delivery/tests/test_required_ci_workflow.py" --validate-required-ci-structure
      - name: Run trusted Required CI tests
        timeout-minutes: 15
        working-directory: ${{ github.workspace }}/.candidate
        env:
          REQUIRED_CI_CANDIDATE_ROOT: ${{ github.workspace }}/.candidate
          REQUIRED_CI_CANDIDATE_SHA: ${{ github.sha }}
          REQUIRED_CI_ISOLATION_MODE: sudo-setpriv-v1
        run: |
          python3 -I -B -S -c 'import os,sys,time; environment=os.environ.copy(); environment["REQUIRED_CI_SUPERVISOR_DEADLINE"]=f"{time.monotonic()+720:.9f}"; os.execve(sys.executable,[sys.executable,"-I","-B","-S",environment["GITHUB_WORKSPACE"]+"/.required-ci/skills/waited-delivery/tests/test_required_ci_workflow.py","--run-trusted-tests"],environment)'
