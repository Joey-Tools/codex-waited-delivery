name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-waited-delivery' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          repository: Joey-Tools/codex-waited-delivery
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile Python helpers
        run: |
          python3 -m py_compile skills/waited-delivery/scripts/*.py
      - name: Run tests
        run: |
          python3 -m unittest discover -s skills/waited-delivery/tests
